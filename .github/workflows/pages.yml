name: Deploy web to GitHub Pages

# Publishes web/ to https://griffin-brown-95.github.io/nudge/
# Requires Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp every module and stylesheet URL with this commit, so a returning
      # visitor never mixes freshly deployed files with stale cached ones
      # (Pages lets browsers cache for 10 minutes).
      - name: Stamp asset URLs with the build
        run: |
          BUILD="${GITHUB_SHA::8}"
          grep -rl "__BUILD__" web | xargs sed -i "s/__BUILD__/${BUILD}/g"
          ! grep -rn "__BUILD__" web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
